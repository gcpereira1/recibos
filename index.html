<main class="app-main">
  <section class="page is-active" id="inicio" aria-labelledby="hello">
    <h1 class="title" id="hello">Olá.</h1>
    <div id="home-notices"></div>
    <div class="stack">
      <button class="cds--btn cds--btn--primary cds--btn--xl cds--layout--size-xl full" id="photo-action">
        Fotografar recibo<svg class="cds--btn__icon" aria-hidden="true"><use href="#i-camera"/></svg>
      </button>
      <button class="cds--btn cds--btn--tertiary cds--btn--xl cds--layout--size-xl full" id="file-action">
        Carregar PDF ou foto<svg class="cds--btn__icon" aria-hidden="true"><use href="#i-document-add"/></svg>
      </button>
    </div>
    <div class="cds--tile pending-tile">
      <div class="pending-row"><span class="label">Por enviar</span><span class="count" id="pending-count">0</span></div>
      <p class="muted" id="pending-detail"></p>
      <button class="cds--btn cds--btn--tertiary cds--btn--xl cds--layout--size-xl full" id="close-action">
        Fechar o mês e enviar<svg class="cds--btn__icon" aria-hidden="true"><use href="#i-send"/></svg>
      </button>
    </div>
  </section>

  <section class="page" id="notas" aria-labelledby="notas-title">
    <h1 class="title" id="notas-title">Recibos</h1>
    <div class="cds--content-switcher cds--content-switcher--lg cds--layout--size-lg switcher" role="tablist" aria-label="Estado dos recibos">
      <button class="cds--content-switcher-btn cds--content-switcher--selected" role="tab" aria-selected="true" data-view="pending"><span class="cds--content-switcher__label">Por enviar</span></button>
      <button class="cds--content-switcher-btn" role="tab" aria-selected="false" data-view="sent"><span class="cds--content-switcher__label">Enviados</span></button>
    </div>
    <div id="notes-list"></div>
  </section>

  <section class="page" id="projetos" aria-labelledby="projetos-title">
    <h1 class="title" id="projetos-title">Projetos</h1>
    <form id="add-project-form" class="stack">
      <div class="cds--form-item cds--text-input-wrapper">
        <label for="new-project" class="cds--label">Novo projeto</label>
        <div class="cds--text-input__field-outer-wrapper"><div class="cds--text-input__field-wrapper">
          <input id="new-project" class="cds--text-input cds--text-input--lg cds--layout--size-lg" type="text" maxlength="60" autocomplete="off" placeholder="Ex.: Obra Rua Augusta">
        </div></div>
      </div>
      <button class="cds--btn cds--btn--primary cds--btn--xl cds--layout--size-xl full" type="submit">Adicionar projeto<svg class="cds--btn__icon" aria-hidden="true"><use href="#i-add"/></svg></button>
    </form>
    <div id="projects-list"></div>
  </section>

  <section class="page" id="ajustes" aria-labelledby="ajustes-title">
    <h1 class="title" id="ajustes-title">Ajustes</h1>
    <form id="settings-form" class="stack">
      <div class="cds--form-item cds--text-input-wrapper">
        <label for="set-person" class="cds--label">O seu nome</label>
        <div class="cds--text-input__field-outer-wrapper"><div class="cds--text-input__field-wrapper">
          <input id="set-person" class="cds--text-input cds--text-input--lg cds--layout--size-lg" type="text" maxlength="60" autocomplete="name">
        </div></div>
      </div>
      <div class="cds--form-item cds--text-input-wrapper">
        <label for="set-org" class="cds--label">Organização</label>
        <div class="cds--text-input__field-outer-wrapper"><div class="cds--text-input__field-wrapper">
          <input id="set-org" class="cds--text-input cds--text-input--lg cds--layout--size-lg" type="text" maxlength="60" autocomplete="organization">
        </div></div>
      </div>
      <button class="cds--btn cds--btn--primary cds--btn--xl cds--layout--size-xl full" type="submit">Guardar</button>
    </form>

    <div class="cds--tile section-tile">
      <h2 class="subtitle">Cópia de segurança</h2>
      <p class="muted" id="backup-info">Ainda não fez nenhuma cópia.</p>
      <div class="stack">
        <button class="cds--btn cds--btn--primary cds--btn--xl cds--layout--size-xl full" id="backup-action">Guardar cópia<svg class="cds--btn__icon" aria-hidden="true"><use href="#i-folder"/></svg></button>
        <button class="cds--btn cds--btn--tertiary cds--btn--xl cds--layout--size-xl full" id="restore-action">Restaurar cópia<svg class="cds--btn__icon" aria-hidden="true"><use href="#i-renew"/></svg></button>
      </div>
    </div>
  </section>
</main>

<nav class="tabbar" aria-label="Secções">
  <button class="tab is-active" data-tab="inicio"><svg aria-hidden="true"><use href="#i-tab-home"/></svg><span>Início</span></button>
  <button class="tab" data-tab="notas"><svg aria-hidden="true"><use href="#i-tab-receipts"/></svg><span>Recibos</span></button>
  <button class="tab" data-tab="projetos"><svg aria-hidden="true"><use href="#i-tab-projects"/></svg><span>Projetos</span></button>
  <button class="tab" data-tab="ajustes"><svg aria-hidden="true"><use href="#i-tab-settings"/></svg><span>Ajustes</span></button>
</nav>

<input id="photo-input" type="file" accept="image/*" capture="environment" hidden>
<input id="file-input" type="file" accept="image/*,application/pdf,.pdf" multiple hidden>
<input id="restore-input" type="file" accept=".zip,application/zip" hidden>

<div class="cds--modal" id="modal" role="presentation">
  <div class="cds--modal-container cds--modal-container--sm" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="modal-container"></div>
</div>

<div class="onboarding" id="onboarding" hidden></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
